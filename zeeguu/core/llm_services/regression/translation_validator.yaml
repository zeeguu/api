    expect: VALID
    note: '"what does it mean?" - English adds "does", the verb stays bare'
  - word: forstår
    translation: understand
    context: Hun forstår ikke, hvad du mener
    expect: VALID
    note: '"she doesn''t understand" - negation brings "does"'
  - word: forstår
    translation: understand
    context: Jeg forstår ikke, hvad du mener
    expect: VALID
  - word: løb
    translation: run
    context: Han løb hjem i går
    expect: FIX
    card: løb = ran
  - word: løb
    translation: ran
    context: Han løb hjem i går
    expect: VALID
  - word: løber
    translation: run
    context: Vi løber hver morgen i parken
    expect: VALID
  - word: huse
    translation: house
    context: Der er mange huse på vejen
    expect: FIX
    card: huse = houses
  - word: at slå op
    translation: to look up
    context: Du kan prøve at slå op i ordbogen
    expect: [VALID, FIX]
    card: [slå op = look up, at slå op = to look up]

