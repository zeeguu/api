# Regression set for the translation validator (prompts/translation_validator.py).
#
# Each case is what the validator is given (word, translation, context) and what
# it should answer. The rule the cases encode: an exercise shows `translation`
# above `word` in `context`, so the card must read correctly THERE.
#
#   expect: VALID       the pair fits the sentence as it stands
#           FIX         the card should become `card` (form, unit or meaning);
#                       the sentence is kept only if `card` fits it, otherwise
#                       new examples are generated for `card`
#           BROKEN_SENTENCE  the sentence is cut off, ungrammatical or nonsense:
#                       no meaning can be checked against it
#           WORD_NOT_FIT  the sentence is fine, but no meaning of the word fits
#                       it and no expansion gives an expression worth learning
#
# `card` is "word = translation". `expect` and `card` may be lists: any one of
# them passes. `validator_did` is what prod answered, for the cases taken from
# validation_log. `source` and `target` are language codes, Danish -> English
# when left out.

cases:
  # --- the case behind this set (bookmark 812839, 13 Aug 2026) ---
  - word: vil sige
    translation: mean
    context: Jeg lærte, hvad det vil sige at gå, da jeg så evnen forsvinde
    expect: FIX
    card: [vil sige = means, hvad det vil sige = what it means]
    note: '"what it mean to walk" is wrong English; shown in an exercise on 23 Oct'
  - word: vil sige
    translation: will say
    context: Jeg lærte, hvad det vil sige at gå, da jeg så evnen forsvinde
    expect: FIX
    card: [vil sige = means, hvad det vil sige = what it means]
    validator_did: vil sige = mean   # log 13793

