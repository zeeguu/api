name: Unit Testing

on:
  pull_request:
    branches:
      - master
  # Only master. Without a branch filter this also fires on every push to a
  # PR branch, so each push started two identical runs of this workflow at the
  # same second -- doubling CI cost and doubling the exposure to any flake.
  push:
    branches:
      - master
  workflow_dispatch:

# Supersede a running check when new commits land on the same ref. Not on
# master, where each commit is a deploy candidate and wants its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v3
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ matrix.python-version }}-
      - name: Cache Stanza models
        id: cache-stanza
        uses: actions/cache@v3
        with:
          path: stanza_resources
          # Models live in stanza_resources/<stanza version>/; keying on requirements.txt
          # saves a fresh cache after a stanza bump, restore-keys avoids a full redownload otherwise.
          key: ${{ runner.os }}-stanza-models-v4-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-stanza-models-v4-
      - name: Cache NLTK data
        id: cache-nltk
        uses: actions/cache@v3
        with:
          path: nltk_data
          key: ${{ runner.os }}-nltk-data-v3
          restore-keys: |
            ${{ runner.os }}-nltk-data-v3
      - name: Install dependencies
        run: |
          export ZEEGUU_RESOURCES_FOLDER=`pwd`
          echo "ZEEGUU_RESOURCES_FOLDER=$ZEEGUU_RESOURCES_FOLDER" >> $GITHUB_ENV
          echo $ZEEGUU_RESOURCES_FOLDER

          # Recreate venv if cached python symlink is broken (happens after runner image updates)
          VENV_BROKEN=false
          if [ -d "venv" ] && ! venv/bin/python --version &>/dev/null; then
            echo "Cached venv has broken python, recreating..."
            rm -rf venv
            VENV_BROKEN=true
          fi
          python -m venv venv
          source venv/bin/activate

          # Install if cache missed, requirements changed, or venv was broken
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != 'true' ] || [ "$VENV_BROKEN" = "true" ]; then
            echo "Installing Python dependencies..."
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            python setup.py develop
          else
            echo "Using cached virtual environment"
          fi

          # Ensure NLTK data is downloaded (even if venv cached)
          if [ ! -d "nltk_data/tokenizers/punkt_tab" ]; then
            echo "Downloading NLTK data..."
            python -c "import nltk; import os; nltk_data_dir = os.path.join(os.getcwd(), 'nltk_data'); nltk.download('punkt', download_dir=nltk_data_dir); nltk.download('punkt_tab', download_dir=nltk_data_dir); nltk.download('averaged_perceptron_tagger', download_dir=nltk_data_dir)"
          else
            echo "NLTK data cached"
          fi

          # Installer skips languages whose models already exist for this stanza version
          python install_stanza_models.py
      - name: Test with pytest
        run: |
          source venv/bin/activate
          export NLTK_DATA=$ZEEGUU_RESOURCES_FOLDER/nltk_data
          export DEV_SKIP_TRANSLATION=1
          python -m pytest
